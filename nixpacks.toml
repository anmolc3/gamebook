[phases.setup]
nixPkgs = ["nodejs", "openssl"]

[phases.install]
cmds = ["cd server && npm install"]

[phases.build]
cmds = ["cd server && DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@localhost:5432/gameapp_dev} npx prisma generate && npm run build"]

[start]
cmd = "cd server && if [ -n \"$DATABASE_URL\" ] && [[ \"$DATABASE_URL\" != *\"localhost\"* ]]; then npx prisma db push --accept-data-loss; else echo 'DATABASE_URL not set or points to localhost, skipping initial db push'; fi && node dist/server/src/index.js"

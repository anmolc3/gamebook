<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Otter — Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FEF4BB" />
    <link rel="stylesheet" href="/style.css" />
    <meta name="google-signin-client_id" content="584037157308-6jortk40dk68qg2hiuam5pjqgrro0lam.apps.googleusercontent.com" />
    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div class="bg-ambient-glow"></div>
    <div class="login-container">
      <!-- Gaming Controller Art Header (Replaces Dog) -->
      <div class="controller-art">
        <img
          class="controller-image"
          src="/assets/controller.png"
          alt="Gaming Controller"
        />
      </div>

      <!-- Main Form Card -->
      <div class="login-card">
        <div class="card-header">
          <h1 class="app-title">Otter</h1>
          <p class="app-subtitle">Sign in to play with friends, share stories, and conquer the leaderboards.</p>
        </div>

        <!-- Feedback / Error Banner -->
        <div id="feedback-banner" class="feedback-banner hidden" role="alert">
          <span class="feedback-icon">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
          </span>
          <span id="feedback-text" class="feedback-text"></span>
        </div>

        <!-- Standard Login Form -->
        <form id="login-form" class="login-form" autocomplete="on">
          <div class="form-group">
            <label for="usernameOrEmail">Username or Email</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </span>
              <input
                id="usernameOrEmail"
                type="text"
                name="usernameOrEmail"
                placeholder="e.g. alex_rivera"
                required
                autocomplete="username"
              />
            </div>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </span>
              <input
                id="password"
                type="password"
                name="password"
                placeholder="••••••••"
                required
                autocomplete="current-password"
              />
              <button
                id="toggle-password"
                class="toggle-password-btn"
                type="button"
                aria-label="Toggle password visibility"
              >
                <svg class="eye-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="eye-off-icon hidden" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>

          <div class="forgot-row">
            <a id="forgot-password-link" class="forgot-link" href="#">Forgot Password?</a>
          </div>

          <!-- Primary Pink Sign In Button -->
          <button id="signin-btn" class="btn btn-primary" type="submit">
            <span class="btn-text">Sign In</span>
            <span class="btn-spinner hidden"></span>
            <svg class="btn-arrow" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </form>

        <!-- Subtle "OR" Divider -->
        <div class="divider">
          <span class="divider-line"></span>
          <span class="divider-text">OR</span>
          <span class="divider-line"></span>
        </div>

        <!-- Charcoal Google Sign-In Button with Official Logo -->
        <button id="google-signin-btn" class="btn btn-google" type="button">
          <img class="google-icon" src="/assets/google-icon.svg" alt="Google logo" />
          <span class="google-btn-text">Continue with Google</span>
          <span class="google-spinner hidden"></span>
        </button>

        <!-- Hidden container for Google Identity Services One Tap / popup anchor -->
        <div id="g_id_onload" class="hidden"></div>

        <!-- Card Footer -->
        <div class="card-footer">
          <span>Don't have an account? </span>
          <a id="create-account-link" class="signup-link" href="#">Create Account</a>
        </div>
      </div>
    </div>

    <script src="/script.js"></script>
  </body>
</html>

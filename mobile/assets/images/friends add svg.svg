<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Friends Add</title>
  <desc>Glossy friends logo with add friend button.</desc>
  <defs>
    <linearGradient id="avatar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#59D7FF"/><stop offset="0.5" stop-color="#1789F5"/><stop offset="1" stop-color="#0750C7"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF49A"/><stop offset=".35" stop-color="#FFD12E"/>
      <stop offset=".72" stop-color="#E99A12"/><stop offset="1" stop-color="#9C5A08"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6CFF76"/><stop offset=".5" stop-color="#20C84B"/><stop offset="1" stop-color="#087A32"/>
    </linearGradient>
    <linearGradient id="textGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF27A"/><stop offset=".45" stop-color="#FFC928"/>
      <stop offset="1" stop-color="#E77D08"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#061634" flood-opacity=".45"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity=".3"/>
    </filter>
  </defs>

  <!-- Three overlapping avatars -->
  <g filter="url(#shadow)" stroke="#071B55" stroke-width="9">
    <!-- left -->
    <circle cx="245" cy="245" r="112" fill="url(#gold)"/>
    <circle cx="245" cy="245" r="91" fill="url(#avatar)"/>
    <path d="M100 500c8-125 72-185 145-185s137 60 145 185z" fill="url(#gold)"/>
    <path d="M126 482c11-91 51-132 119-132s108 41 119 132z" fill="url(#avatar)"/>

    <!-- right -->
    <circle cx="655" cy="245" r="112" fill="url(#gold)"/>
    <circle cx="655" cy="245" r="91" fill="url(#avatar)"/>
    <path d="M510 500c8-125 72-185 145-185s137 60 145 185z" fill="url(#gold)"/>
    <path d="M536 482c11-91 51-132 119-132s108 41 119 132z" fill="url(#avatar)"/>

    <!-- center -->
    <circle cx="450" cy="205" r="137" fill="url(#gold)"/>
    <circle cx="450" cy="205" r="112" fill="url(#avatar)"/>
    <path d="M270 535c9-150 78-220 180-220s171 70 180 220z" fill="url(#gold)"/>
    <path d="M302 510c12-111 60-162 148-162s136 51 148 162z" fill="url(#avatar)"/>
  </g>

  <!-- Gloss highlights -->
  <g fill="none" stroke="#fff" stroke-linecap="round" opacity=".3">
    <path d="M398 150c25-31 59-48 96-50" stroke-width="17"/>
    <path d="M212 212c17-22 38-34 64-38" stroke-width="13"/>
    <path d="M622 212c17-22 38-34 64-38" stroke-width="13"/>
  </g>


  <!-- Add button -->
  <g filter="url(#shadow)">
    <circle cx="700" cy="475" r="116" fill="#071B55" stroke="url(#gold)" stroke-width="12"/>
    <circle cx="700" cy="475" r="91" fill="url(#green)" stroke="#0A6B2E" stroke-width="6"/>
    <circle cx="672" cy="445" r="25" fill="#fff" opacity=".22"/>
    <rect x="681" y="421" width="38" height="108" rx="19" fill="#fff"/>
    <rect x="646" y="456" width="108" height="38" rx="19" fill="#fff"/>
  </g>
</svg>
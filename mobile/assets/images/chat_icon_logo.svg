<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Chat</title>
  <desc>Glossy chat bubble logo with gold rim, matching the Friends Add style.</desc>
  <defs>
    <linearGradient id="avatar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#59D7FF"/><stop offset="0.5" stop-color="#1789F5"/><stop offset="1" stop-color="#0750C7"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF49A"/><stop offset=".35" stop-color="#FFD12E"/>
      <stop offset=".72" stop-color="#E99A12"/><stop offset="1" stop-color="#9C5A08"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#061634" flood-opacity=".45"/>
    </filter>
    <path id="bubble" d="M290 120H610A140 140 0 0 1 750 260V400A140 140 0 0 1 610 540H430L240 690L300 540H290A140 140 0 0 1 150 400V260A140 140 0 0 1 290 120Z"/>
  </defs>

  <!-- Bubble: gold rim + blue face -->
  <g filter="url(#shadow)" stroke="#071B55" stroke-width="9" stroke-linejoin="round">
    <use href="#bubble" fill="url(#gold)"/>
    <use href="#bubble" fill="url(#avatar)" transform="translate(450 330) scale(.86) translate(-450 -330)"/>
  </g>

  <!-- Gloss highlights -->
  <g fill="none" stroke="#fff" stroke-linecap="round" opacity=".3">
    <path d="M250 235c25-40 70-65 125-70" stroke-width="20"/>
    <path d="M215 300c3-14 8-26 15-37" stroke-width="14"/>
  </g>

  <!-- Typing dots -->
  <g fill="#fff" stroke="#071B55" stroke-width="6">
    <circle cx="320" cy="330" r="38"/>
    <circle cx="450" cy="330" r="38"/>
    <circle cx="580" cy="330" r="38"/>
  </g>
  <g fill="#fff" opacity=".6">
    <circle cx="308" cy="318" r="10"/><circle cx="438" cy="318" r="10"/><circle cx="568" cy="318" r="10"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Social</title>
  <desc>Glossy social network logo: three connected people nodes with a heart, matching the Friends Add style.</desc>
  <defs>
    <linearGradient id="avatar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#59D7FF"/><stop offset="0.5" stop-color="#1789F5"/><stop offset="1" stop-color="#0750C7"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF49A"/><stop offset=".35" stop-color="#FFD12E"/>
      <stop offset=".72" stop-color="#E99A12"/><stop offset="1" stop-color="#9C5A08"/>
    </linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9DB0"/><stop offset=".5" stop-color="#F0264F"/><stop offset="1" stop-color="#A80E30"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#061634" flood-opacity=".45"/>
    </filter>
    <g id="node">
      <circle r="112" fill="url(#gold)"/>
      <circle r="88" fill="url(#avatar)"/>
      <path d="M-44 52c0-34 20-50 44-50s44 16 44 50z" fill="#fff" stroke="none"/>
      <circle cy="-22" r="24" fill="#fff" stroke="none"/>
      <path d="M-62 -38c14-24 34-36 58-38" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity=".3"/>
    </g>
  </defs>

  <!-- Connections -->
  <g filter="url(#shadow)" fill="none" stroke-linecap="round">
    <g stroke="#071B55" stroke-width="40">
      <path d="M450 190L230 590M450 190L670 590M230 590L670 590"/>
    </g>
    <g stroke="url(#gold)" stroke-width="22">
      <path d="M450 190L230 590M450 190L670 590M230 590L670 590"/>
    </g>
  </g>

  <!-- Nodes -->
  <g filter="url(#shadow)" stroke="#071B55" stroke-width="9">
    <use href="#node" x="450" y="190"/>
    <use href="#node" x="230" y="590"/>
    <use href="#node" x="670" y="590"/>
  </g>

  <!-- Heart -->
  <g filter="url(#shadow)" transform="translate(450 440) scale(1.25)">
    <path d="M0 48C-84 -6 -54 -60 0 -24C54 -60 84 -6 0 48Z" fill="url(#heart)" stroke="#071B55" stroke-width="7" stroke-linejoin="round"/>
    <path d="M-40 -22c8-10 18-12 26-6" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".45"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Notification</title>
  <desc>Glossy notification bell icon with gold rim, blue face, matching the Friends Add style.</desc>
  <defs>
    <linearGradient id="avatar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#59D7FF"/><stop offset="0.5" stop-color="#1789F5"/><stop offset="1" stop-color="#0750C7"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF49A"/><stop offset=".35" stop-color="#FFD12E"/>
      <stop offset=".72" stop-color="#E99A12"/><stop offset="1" stop-color="#9C5A08"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#061634" flood-opacity=".45"/>
    </filter>
    <path id="bell" d="M450 170C340 170 270 260 270 380V500C270 540 240 565 210 590C195 603 205 625 225 625H675C695 625 705 603 690 590C660 565 630 540 630 500V380C630 260 560 170 450 170Z"/>
  </defs>

  <g filter="url(#shadow)" stroke="#071B55" stroke-width="5" stroke-linejoin="round">
    <!-- clapper and top knob -->
    <circle cx="450" cy="672" r="52" fill="url(#gold)"/>
    <circle cx="450" cy="150" r="34" fill="url(#gold)"/>
    <!-- bell: gold rim + blue face -->
    <use href="#bell" fill="url(#gold)"/>
    <use href="#bell" fill="url(#avatar)" transform="translate(450 400) scale(.86) translate(-450 -400)"/>
  </g>

  <!-- Gloss highlights -->
  <g fill="none" stroke="#fff" stroke-linecap="round" opacity=".35">
    <path d="M330 300c14-42 45-72 90-82" stroke-width="20"/>
    <path d="M325 400v70" stroke-width="14"/>
  </g>
</svg>

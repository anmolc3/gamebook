<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Game Joystick</title>
  <desc>Glossy arcade joystick game icon, matching the Friends Add style.</desc>
  <defs>
    <linearGradient id="avatar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#59D7FF"/><stop offset="0.5" stop-color="#1789F5"/><stop offset="1" stop-color="#0750C7"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF49A"/><stop offset=".35" stop-color="#FFD12E"/>
      <stop offset=".72" stop-color="#E99A12"/><stop offset="1" stop-color="#9C5A08"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6CFF76"/><stop offset=".5" stop-color="#20C84B"/><stop offset="1" stop-color="#087A32"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9DB0"/><stop offset=".5" stop-color="#F0264F"/><stop offset="1" stop-color="#A80E30"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#061634" flood-opacity=".45"/>
    </filter>
    <path id="base" d="M170 570Q170 500 240 500H660Q730 500 730 570V630Q730 700 660 700H240Q170 700 170 630Z"/>
  </defs>

  <g filter="url(#shadow)" stroke="#071B55" stroke-width="9" stroke-linejoin="round">
    <!-- shaft -->
    <rect x="425" y="290" width="50" height="250" rx="12" fill="url(#gold)"/>
    <!-- base: gold rim + blue face -->
    <use href="#base" fill="url(#gold)"/>
    <use href="#base" fill="url(#avatar)" transform="translate(450 600) scale(.9 .8) translate(-450 -600)"/>
    <!-- ball -->
    <circle cx="450" cy="220" r="125" fill="url(#red)"/>
  </g>

  <!-- Button + slot on base -->
  <g stroke="#071B55" stroke-width="7">
    <circle cx="610" cy="600" r="34" fill="url(#green)"/>
  </g>
  <rect x="240" y="588" width="130" height="24" rx="12" fill="#fff"/>

  <!-- Gloss highlights -->
  <g fill="none" stroke="#fff" stroke-linecap="round" opacity=".35">
    <path d="M370 170c20-30 50-48 85-52" stroke-width="22"/>
    <path d="M230 560c20-14 45-20 75-20" stroke-width="12"/>
  </g>
</svg>

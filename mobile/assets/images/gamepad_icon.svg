<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Gamepad</title>
  <desc>Glossy retro gamepad icon with gold rim, matching the Friends Add style.</desc>
  <defs>
    <linearGradient id="avatar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#59D7FF"/><stop offset="0.5" stop-color="#1789F5"/><stop offset="1" stop-color="#0750C7"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF49A"/><stop offset=".35" stop-color="#FFD12E"/>
      <stop offset=".72" stop-color="#E99A12"/><stop offset="1" stop-color="#9C5A08"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6CFF76"/><stop offset=".5" stop-color="#20C84B"/><stop offset="1" stop-color="#087A32"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9DB0"/><stop offset=".5" stop-color="#F0264F"/><stop offset="1" stop-color="#A80E30"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#061634" flood-opacity=".45"/>
    </filter>
    <rect id="pad" x="80" y="235" width="740" height="330" rx="165"/>
  </defs>

  <g filter="url(#shadow)" stroke="#071B55" stroke-width="9" stroke-linejoin="round">
    <use href="#pad" fill="url(#gold)"/>
    <use href="#pad" fill="url(#avatar)" transform="translate(450 400) scale(.9 .84) translate(-450 -400)"/>
    <!-- d-pad -->
    <path d="M-24 -70H24V-24H70V24H24V70H-24V24H-70V-24H-24Z" fill="#fff" transform="translate(245 400)"/>
    <!-- two action buttons -->
    <circle cx="615" cy="445" r="46" fill="url(#green)"/>
    <circle cx="715" cy="370" r="46" fill="url(#red)"/>
  </g>

  <!-- Start / select -->
  <g fill="#fff" stroke="#071B55" stroke-width="5">
    <rect x="375" y="430" width="70" height="24" rx="12" transform="rotate(-25 410 442)"/>
    <rect x="455" y="430" width="70" height="24" rx="12" transform="rotate(-25 490 442)"/>
  </g>

  <!-- Gloss highlights -->
  <g fill="none" stroke="#fff" stroke-linecap="round" opacity=".3">
    <path d="M200 310c40-30 100-42 170-42" stroke-width="20"/>
    <path d="M598 430c6-8 14-12 24-12" stroke-width="9"/>
    <path d="M698 355c6-8 14-12 24-12" stroke-width="9"/>
  </g>
</svg>
